name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install local SVN tools
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Test read-only adapters and protocols
        run: python -m unittest discover -s plugins/local-scm-diff/tests -v
      - name: Check JavaScript
        run: node --check plugins/local-scm-diff/assets/app.js
